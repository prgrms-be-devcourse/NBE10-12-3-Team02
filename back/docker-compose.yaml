services:
  redis-master:
    image: redis:7.2-alpine
    container_name: redis-master
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --replica-announce-ip redis-master --requirepass ""
    labels:
      - "org.springframework.boot.ignore=true"
    networks:
      - redis-net

  redis-slave:
    image: redis:7.2-alpine
    container_name: redis-slave
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --replicaof redis-master 6379 --replica-announce-ip redis-slave --requirepass "" --masterauth ""
    labels:
      - "org.springframework.boot.ignore=true"
    depends_on:
      - redis-master
    networks:
      - redis-net

  redis-sentinel-1:
    image: redis:7.2-alpine
    container_name: redis-sentinel-1
    ports:
      - "26379:26379"
    command: >
      sh -c "printf 'port 26379\nsentinel monitor mymaster redis-master 6379 2\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel announce-ip redis-sentinel-1\n' > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    labels:
      - "org.springframework.boot.ignore=true"
    depends_on:
      - redis-master
      - redis-slave
    networks:
      - redis-net

  redis-sentinel-2:
    image: redis:7.2-alpine
    container_name: redis-sentinel-2
    ports:
      - "26380:26379"
    command: >
      sh -c "printf 'port 26379\nsentinel monitor mymaster redis-master 6379 2\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel announce-ip redis-sentinel-2\n' > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    labels:
      - "org.springframework.boot.ignore=true"
    depends_on:
      - redis-master
      - redis-slave
    networks:
      - redis-net

  redis-sentinel-3:
    image: redis:7.2-alpine
    container_name: redis-sentinel-3
    ports:
      - "26381:26379"
    command: >
      sh -c "printf 'port 26379\nsentinel monitor mymaster redis-master 6379 2\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel announce-ip redis-sentinel-3\n' > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    labels:
      - "org.springframework.boot.ignore=true"
    depends_on:
      - redis-master
      - redis-slave
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge
