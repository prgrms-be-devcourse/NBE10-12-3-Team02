spring:
  threads:
    virtual:
      enabled: true
  application:
    name: back
  profiles:
    active: dev
    include:
      - secret
  output:
    ansi:
      enabled: always
  datasource:
    hikari:
      auto-commit: false
  mail:
    host: smtp.naver.com
    port: 465
    protocol: smtps
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  security:
    oauth2:
      front-callback-url: "http://localhost:3000"
      front-login-url: "http://localhost:3000/login"
      front-social-link-url: "http://localhost:3000/mypage"
      client:
        registration:
          kakao:
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
          naver:
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            client-name: Naver
          google:
            scope:
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
springdoc:
  default-produces-media-type: application/json;charset=UTF-8
custom:
  auth:
    email-verification:
      code-expiration-seconds: 300
      verified-expiration-seconds: 1800
      resend-cooldown-seconds: 60
      max-attempts: 5
      redis-prefix: "auth:email-verification:"
  jwt:
    accessToken:
      expirationSeconds: "#{60*10}"
    refreshToken:
      expirationSeconds: "#{60*60*24*7}"
    blacklist:
      grace-seconds: 60
  cors:
    allowed-origins: http://localhost:3000
  redis:
    refresh-token:
      prefix: "auth:refresh:"
      index-prefix: "auth:refresh:index:"
  oauth2:
    link-intent-prefix: "auth:oauth2:link:"
    link-intent-expiration-seconds: 300
  upload:
    path: ${CUSTOM_UPLOAD_PATH:./uploads}

app:
  rate-limit:
    seat-status:
      capacity: 5
      refill-tokens: 5
      refill-seconds: 1
      expire-after-access-minutes: 10
      maximum-size: 10000
queue:
  batch-size: 2
  max-active-users: 2
  entry-token:
    ttl: 10m
  sse:
    timeout: ${QUEUE_SSE_TIMEOUT:30m}
    heartbeat-interval: ${QUEUE_SSE_HEARTBEAT_INTERVAL:20s}
    outbox:
      enabled: ${QUEUE_SSE_OUTBOX_ENABLED:true}
      polling-interval: ${QUEUE_SSE_OUTBOX_POLLING_INTERVAL:1000ms}
      cleanup-interval: ${QUEUE_SSE_OUTBOX_CLEANUP_INTERVAL:1h}
      batch-size: ${QUEUE_SSE_OUTBOX_BATCH_SIZE:100}
      max-retries: ${QUEUE_SSE_OUTBOX_MAX_RETRIES:3}
      retry-delay: ${QUEUE_SSE_OUTBOX_RETRY_DELAY:5s}
      processing-timeout: ${QUEUE_SSE_OUTBOX_PROCESSING_TIMEOUT:30s}
      terminal-event-ttl: ${QUEUE_SSE_OUTBOX_TERMINAL_EVENT_TTL:10m}
      retention: ${QUEUE_SSE_OUTBOX_RETENTION:1d}
