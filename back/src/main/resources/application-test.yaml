spring:
  datasource:
    url: jdbc:h2:mem:db_test;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # Redisson은 자체 config 방식으로 동작하므로 standalone dummy 설정
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://127.0.0.1:6379"
        threads: 4
        nettyThreads: 8
        codec: !<org.redisson.codec.JsonJacksonCodec> {}
custom:
  cors:
    allowed-origins: http://localhost:3000
# 테스트 환경에서 백그라운드 Delayed Queue 핸들러 비활성화 (mock 충돌 방지)
seat:
  hold:
    handler:
      enabled: false