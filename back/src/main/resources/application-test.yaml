spring:
  datasource:
    url: jdbc:h2:mem:db_test;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  ai:
    openai:
      # 테스트에서는 ChatClient 빈 생성만 되면 되고 실제 OpenAI 호출은 전부 mock으로
      # 대체하므로 값은 형식만 갖춘 더미면 충분하다. spring.profiles.active(test)가
      # spring.profiles.include(secret)보다 우선하므로 CI에 시크릿이 없어도,
      # 로컬에 진짜 키가 있어도 테스트에서는 항상 이 값으로 덮어써진다.
      api-key: test-key-not-real
custom:
  cors:
    allowed-origins: http://localhost:3000
# 테스트 환경에서 백그라운드 Delayed Queue 핸들러 비활성화 (mock 충돌 방지)
seat:
  hold:
    handler:
      enabled: false
