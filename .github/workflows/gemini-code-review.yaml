name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Run Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import subprocess
          from google import genai

          # 1. PR의 Git Diff 추출 (Command Injection 방지: shell=True 제거 및 인자 리스트 전달)
          base_ref = os.environ.get("BASE_REF", "main")
          diff_cmd = [
              "git", "diff", f"origin/{base_ref}...HEAD", "--", ".",
              # 공통 / 락 파일 / 미디어 제외
              ":!*.lock", ":!package-lock.json", ":!yarn.lock", ":!pnpm-lock.yaml",
              ":!*.png", ":!*.jpg", ":!*.jpeg", ":!*.svg", ":!*.ico", ":!*.pdf",
              # 백엔드(Kotlin/Spring Boot) 빌드 및 캐시 제외
              ":!back/build/*", ":!back/target/*", ":!back/.gradle/*", ":!back/out/*", ":!back/.idea/*",
              # 모노레포 루트 및 프론트엔드/백엔드 모듈, 빌드 결과물 제외
              ":!node_modules/*", ":!.pnpm-store/*", ":!back/node_modules/*", ":!front/node_modules/*", ":!front/.pnpm-store/*",
              ":!front/dist/*", ":!front/build/*", ":!front/.next/*", ":!front/.turbo/*"
          ]

          try:
              diff = subprocess.check_output(diff_cmd, text=True)
          except subprocess.CalledProcessError as e:
              print(f"Git diff 추출 실패: {e}")
              sys.exit(1)

          if not diff.strip():
              print("검토할 주요 변경 사항이 없습니다.")
              sys.exit(0)

          # Diff 분량이 너무 클 경우 잘라내기 (토큰 절약 및 속도 향상)
          if len(diff) > 40000:
              diff = diff[:40000] + "\n... (Diff truncated due to size)"

          # 2. Gemini API 호출 (도메인 맞춤형 수석 엔지니어 프롬프트)
          prompt = f"""
          너는 꼼꼼하고 친절한 대용량 트래픽 대기열/티켓팅 시스템 전문 수석 소프트웨어 엔지니어야.
          현재 프로젝트는 백엔드(`back/`)와 프론트엔드(`front/`)가 함께 있는 모노레포(Monorepo) 구조야.

          [프로젝트 정확한 기술 스택]
          - Backend (`back/`): Kotlin 2.4.10 (100% 코틀린 프로젝트), Spring Boot 4.0.7 (Virtual Threads 적용), Java 25, Redisson 4.6.1, MySQL, Redis 7.2 Sentinel, OAuth2 (Kakao/Naver/Google), JJWT 0.13.0, Bucket4j
          - Frontend (`front/`): Next.js 16.2.9 (App Router), React 19.2.4, TypeScript 5.x, TailwindCSS 4.x, Node.js 22.x (LTS), pnpm 9.x, STOMP/WebSocket

          아래 Pull Request의 Git Diff를 검토하고 코드 리뷰를 작성해줘.

          리뷰 지침:
          1. **변경 사항 요약**: 변경된 영역(`back/`, `front/` 또는 전체)과 핵심 목적을 2~3줄로 요약해줘.
          2. **백엔드 검토 포인트 (`back/`)**:
             - 관용적인 코틀린(Idiomatic Kotlin) 작성 여부 (Scope 함수 `with/apply/run`, `ifEmpty`, 단일 표현식 함수, Null-safety, 불필요한 `var` 사용 지양)
             - Spring Boot 4.x & Virtual Threads 호환성 (Virtual Thread 피닝을 일으키는 `synchronized` 블록 지양)
             - Redisson 데이터 조율 시 코덱 일치 여부 (Raw String/Token 조작 시 `StringCodec.INSTANCE` 명시 여부 검증)
             - 좌석 선점(10분 TTL) & Delayed Queue 이벤트 처리 및 분산 락/JPA 락 동시성(Race Condition) 검증
             - 회차당 1인 최대 3매 예매 제한 로직 보호 여부
             - Refresh Token Rotation (RTR) 탈취 검증 & Access Token 블랙리스트 처리
          3. **프론트엔드 검토 포인트 (`front/`)**:
             - React 19 및 Next.js 16 App Router 작성 관례 (useEffect 동기 `setState` 지양, `"use client"` 지시어 적절성, React 19 Hook 활용)
             - TypeScript 5.x 엄격한 타입 정의 (`any` 사용 금지, 명확한 인터페이스/Type Assertion)
             - STOMP / WebSocket 소켓 연결 라이프사이클 (페이지 이동 시 disconnect & unsubscribe 명시를 통한 메모리 누수 방지)
             - TailwindCSS 4.x 스타일링 가이드 준수 및 불필요한 재렌더링 최적화
          4. **보안 및 코드 품질**:
             - 보안 이슈 (비밀번호/키 노출, XSS, SQL Injection 등)
             - 가독성 및 개선 아이디어 (개선된 코드 예시 필수 포함)
          5. **톤앤매너**: 이모티콘 없이 답변은 한국어로 작성하며, 친절하고 건설적(Constructive)인 톤을 유지해줘.

          Git Diff:
          ```diff
          {diff}
          ```
          """

          try:
              client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
              response = client.models.generate_content(
                  model="gemini-3.6-flash",
                  contents=prompt,
              )
              review_body = response.text
          except Exception as e:
              print(f"Gemini API 호출 중 오류 발생: {e}")
              sys.exit(1)

          # 3. 접기/펼치기 HTML formatting 적용 및 기존 댓글 덮어쓰기/신규 작성
          formatted_review = f"<details>\n<summary>🤖 <b>Gemini AI 코드 리뷰 (클릭하여 최신 리뷰 보기)</b></summary>\n\n{review_body}\n</details>"

          review_file = "review.txt"
          repo = os.environ["REPO"]
          pr_number = os.environ["PR_NUMBER"]

          try:
              with open(review_file, "w", encoding="utf-8") as f:
                  f.write(formatted_review)

              # 기존 Gemini 리뷰 댓글 확인
              existing_comment_id = None
              try:
                  comments_json = subprocess.check_output(
                      ["gh", "api", f"repos/{repo}/issues/{pr_number}/comments"],
                      text=True
                  )
                  comments = json.loads(comments_json)
                  for comment in comments:
                      if "Gemini AI 코드 리뷰" in comment.get("body", ""):
                          existing_comment_id = comment["id"]
                          break
              except Exception as e:
                  print(f"기존 댓글 조회 중 오류 발생 (신규 작성 처리): {e}")

              if existing_comment_id:
                  # 기존 댓글 내용 덮어쓰기 (PATCH)
                  subprocess.run(
                      ["gh", "api", "-X", "PATCH", f"repos/{repo}/issues/comments/{existing_comment_id}", "-F", "body=@review.txt"],
                      check=True
                  )
                  print(f"기존 Gemini 리뷰 댓글(ID: {existing_comment_id}) 덮어쓰기 완료")
              else:
                  # 신규 댓글 작성 (POST)
                  subprocess.run(["gh", "pr", "comment", pr_number, "--body-file", review_file], check=True)
                  print("신규 Gemini 리뷰 댓글 작성 완료")
          finally:
              if os.path.exists(review_file):
                  os.remove(review_file)
          EOF

