name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.svg'
      - '**.ico'
      - '**.pdf'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: "!contains(github.event.head_commit.message, '[skip review]') && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Run Gemini Code Review
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import subprocess
          from google import genai

          # 1. PR의 Git Diff 추출 (Command Injection 방지: shell=True 제거 및 인자 리스트 전달)
          base_ref = os.environ.get("BASE_REF", "main")
          diff_cmd = [
              "git", "diff", f"origin/{base_ref}...HEAD", "--", ".",
              # 공통 / 락 파일 / 미디어 제외
              ":!*.lock", ":!package-lock.json", ":!yarn.lock", ":!pnpm-lock.yaml",
              ":!*.png", ":!*.jpg", ":!*.jpeg", ":!*.svg", ":!*.ico", ":!*.pdf",
              # 백엔드(Kotlin/Spring Boot) 빌드 및 캐시 제외
              ":!back/build/*", ":!back/target/*", ":!back/.gradle/*", ":!back/out/*", ":!back/.idea/*",
              # 모노레포 루트 및 프론트엔드/백엔드 모듈, 빌드 결과물 제외
              ":!node_modules/*", ":!.pnpm-store/*", ":!back/node_modules/*", ":!front/node_modules/*", ":!front/.pnpm-store/*",
              ":!front/dist/*", ":!front/build/*", ":!front/.next/*", ":!front/.turbo/*"
          ]

          try:
              diff = subprocess.check_output(diff_cmd, text=True)
          except subprocess.CalledProcessError as e:
              print(f"Git diff 추출 실패: {e}")
              sys.exit(0)

          if not diff.strip():
              print("검토할 주요 변경 사항이 없습니다.")
              exit(0)

          # Diff 분량이 너무 클 경우 잘라내기 (토큰 절약 및 속도 향상)
          if len(diff) > 40000:
              diff = diff[:40000] + "\n... (Diff truncated due to size)"

          # 2. 독립된 md 지침 파일 읽기 및 Gemini API 호출
          instruction_path = ".github/prompts/gemini-review-instruction.md"
          try:
              with open(instruction_path, "r", encoding="utf-8") as f:
                  instruction = f.read()
          except Exception as e:
              print(f"코드 리뷰 지침 파일 읽기 실패: {e}")
              instruction = "너는 백엔드(Kotlin), 프론트엔드(Next.js), E2E(Playwright) 전문 수석 리뷰어야."

          prompt = f"{instruction}\n\n[Pull Request Git Diff]\n```diff\n{diff}\n```"

          try:
              client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
              response = client.models.generate_content(
                  model="gemini-3.6-flash",
                  contents=prompt,
              )
              review_body = response.text
          except Exception as e:
              err_msg = str(e)
              print(f"Gemini API 호출 중 예외 발생 (안내 메시지 생성): {err_msg}")
              if "429" in err_msg or "RESOURCE_EXHAUSTED" in err_msg or "quota" in err_msg.lower():
                  review_body = "⚠️ **Gemini API 일일 할당량(Quota) 초과 안내**\n\n현재 Gemini API 일일 무료 호출 한도가 일시적으로 초과되어 AI 코드 리뷰 생성을 건너뛰었습니다.\n- **참고**: PR 기능 검증 및 CI 빌드 테스트는 정상 통과(Success)로 처리됩니다."
              else:
                  review_body = f"⚠️ **Gemini API 연동 안내**\n\n코드 리뷰 생성 중 예외가 발생했습니다: `{err_msg}`"

          # 3. 기본적으로 펼쳐진(<details open>) 접기/펼치기 HTML formatting 적용
          formatted_review = f"<details open>\n<summary>🤖 <b>Gemini AI 코드 리뷰 (클릭하여 접기/펼치기)</b></summary>\n\n{review_body}\n</details>"

          review_file = "review.txt"
          repo = os.environ["REPO"]
          pr_number = os.environ["PR_NUMBER"]

          try:
              with open(review_file, "w", encoding="utf-8") as f:
                  f.write(formatted_review)

              # 기존 Gemini 리뷰 댓글 확인
              existing_comment_id = None
              try:
                  comments_json = subprocess.check_output(
                      ["gh", "api", f"repos/{repo}/issues/{pr_number}/comments"],
                      text=True
                  )
                  comments = json.loads(comments_json)
                  for comment in comments:
                      if "Gemini AI 코드 리뷰" in comment.get("body", ""):
                          existing_comment_id = comment["id"]
                          break
              except Exception as e:
                  print(f"기존 댓글 조회 중 오류 발생 (신규 작성 처리): {e}")

              if existing_comment_id:
                  # 기존 댓글 내용 덮어쓰기 (PATCH)
                  subprocess.run(
                      ["gh", "api", "-X", "PATCH", f"repos/{repo}/issues/comments/{existing_comment_id}", "-F", "body=@review.txt"],
                      check=True
                  )
                  print(f"기존 Gemini 리뷰 댓글(ID: {existing_comment_id}) 덮어쓰기 완료")
              else:
                  # 신규 댓글 작성 (POST)
                  subprocess.run(["gh", "pr", "comment", pr_number, "--body-file", review_file], check=True)
                  print("신규 Gemini 리뷰 댓글 작성 완료")
          finally:
              if os.path.exists(review_file):
                  os.remove(review_file)
          EOF

