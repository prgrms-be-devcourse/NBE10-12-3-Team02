name: CD - Build & Deploy Backend (EC2)

# main 브랜치에 백엔드 코드가 머지되면
# ECR로 Docker 이미지를 push하고, AWS SSM send-command로 EC2에 자동 배포합니다.
# (프론트엔드는 Vercel 연동을 통해 자동 배포되므로 EC2 배포 대상에서 제외됩니다.)
on:
  push:
    branches:
      - main
    paths:
      - 'back/**'
      - '.github/workflows/cd.yaml'
  workflow_dispatch: # 수동 실행 허용

# OIDC로 AWS 로그인하기 위한 id-token 권한 설정
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  # ── 1. 백엔드 변경 감지 ──
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'back/**'

  # ── 2. 백엔드 이미지 빌드 → ECR push ──
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secrets 기반 application-secret.yaml 동적 생성 (Docker 이미지에 포함)
      - name: Create application-secret.yaml from Secret
        run: |
          mkdir -p back/src/main/resources
          echo "${{ secrets.APPLICATION_SECRET_YAML }}" > back/src/main/resources/application-secret.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/nbe10-12-3-team02:latest
            ${{ steps.ecr.outputs.registry }}/nbe10-12-3-team02:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. EC2 SSM Blue/Green 무중단 배포 (send-command → wait → 결과 확인) ──
  deploy:
    needs: build-backend
    if: always() && needs.build-backend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Blue/Green 무중단 배포:
      # 1) SSM Parameter Store(/nbe10-12-3-team02/prod/env)에서 .env 조회 (비밀값이
      #    GitHub Actions/SSM 커맨드 파라미터를 거치지 않고 EC2 인스턴스 role로만 조회됨)
      # 2) ECR 로그인 + 새 이미지 pull
      # 3) /etc/nginx/conf.d/upstream.conf를 읽어 현재 활성 포트(8080/8081)를 판별해
      #    반대쪽 색(app-blue/app-green, 포트 8080/8081 고정)으로 새 컨테이너 기동
      # 4) 헬스체크(최대 120초, 3초 간격) 통과 시에만 upstream.conf를 새 포트로 전환 + reload
      #    실패하면 새로 띄운 컨테이너만 제거하고 exit 1 (기존 활성 컨테이너는 그대로 유지되어 무중단)
      # 5) 전환 성공 후 이전 색 컨테이너 정리
      #
      # ⚠️ 컨테이너 안에 curl이 없어(temurin JRE 베이스, 실측 확인) 헬스체크는
      #    docker exec가 아니라 호스트에서 게시된 포트로 직접 curl함
      - name: Send deploy command via SSM
        id: ssm
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMANDS=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg tag "$IMAGE_TAG" \
            '[
              "set -e",
              "mkdir -p /home/ec2-user/app",
              "aws ssm get-parameter --name \"/nbe10-12-3-team02/prod/env\" --with-decryption --query \"Parameter.Value\" --output text > /home/ec2-user/app/.env",
              "chmod 600 /home/ec2-user/app/.env",
              "chown ec2-user:ec2-user /home/ec2-user/app/.env",
              "cd /home/ec2-user/app",
              ("export ECR_REGISTRY=" + $registry),
              ("export IMAGE_TAG=" + $tag),
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              "IMAGE=\"$ECR_REGISTRY/nbe10-12-3-team02:$IMAGE_TAG\"",
              "docker pull \"$IMAGE\"",
              "UPSTREAM_CONF=/etc/nginx/conf.d/upstream.conf",
              "if [ -f \"$UPSTREAM_CONF\" ] && grep -q \"127.0.0.1:8080\" \"$UPSTREAM_CONF\"; then",
              "  BLUE_COLOR=blue; BLUE_PORT=8080; GREEN_COLOR=green; GREEN_PORT=8081",
              "elif [ -f \"$UPSTREAM_CONF\" ] && grep -q \"127.0.0.1:8081\" \"$UPSTREAM_CONF\"; then",
              "  BLUE_COLOR=green; BLUE_PORT=8081; GREEN_COLOR=blue; GREEN_PORT=8080",
              "else",
              "  BLUE_COLOR=none; BLUE_PORT=none; GREEN_COLOR=blue; GREEN_PORT=8080",
              "fi",
              "echo \"Current active: $BLUE_COLOR ($BLUE_PORT) -> deploying: $GREEN_COLOR ($GREEN_PORT)\"",
              "if [ \"$BLUE_COLOR\" = \"none\" ] && docker ps -a --format \"{{.Names}}\" | grep -qx \"app\"; then",
              "  echo \"Legacy app container found with no active upstream target - removing it\"",
              "  docker rm -f app || true",
              "fi",
              "docker rm -f \"app-$GREEN_COLOR\" >/dev/null 2>&1 || true",
              "docker run -d --name \"app-$GREEN_COLOR\" --network app_redis-net -p \"$GREEN_PORT:8080\" --env-file .env --restart unless-stopped \"$IMAGE\"",
              "HEALTHY=false",
              "for i in $(seq 1 40); do",
              "  if curl -sf -o /dev/null \"http://127.0.0.1:$GREEN_PORT/actuator/health\"; then HEALTHY=true; break; fi",
              "  sleep 3",
              "done",
              "if [ \"$HEALTHY\" != \"true\" ]; then",
              "  echo \"Health check failed for app-$GREEN_COLOR\"",
              "  docker logs \"app-$GREEN_COLOR\" --tail 50 || true",
              "  docker rm -f \"app-$GREEN_COLOR\" || true",
              "  exit 1",
              "fi",
              "printf \"upstream app_backend {\\n    server 127.0.0.1:%s;\\n}\\n\" \"$GREEN_PORT\" > \"$UPSTREAM_CONF\"",
              "nginx -t",
              "nginx -s reload",
              "if [ \"$BLUE_COLOR\" != \"none\" ]; then sleep 5; docker rm -f \"app-$BLUE_COLOR\" || true; fi",
              "docker image prune -f",
              "echo \"Deploy complete: active=app-$GREEN_COLOR port=$GREEN_PORT\""
            ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Blue/Green deploy backend ${{ github.sha }}" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy command to finish
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Check deploy command result
        if: always()
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deploy command status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM deploy command finished with status: $STATUS"
            exit 1
          fi
