name: CD - Build & Deploy Backend (EC2)

# main 브랜치에 백엔드 코드가 머지되면
# ECR로 Docker 이미지를 push하고, AWS SSM send-command로 EC2에 자동 배포합니다.
# (프론트엔드는 Vercel 연동을 통해 자동 배포되므로 EC2 배포 대상에서 제외됩니다.)
on:
  push:
    branches:
      - main
    paths:
      - 'back/**'
      - '.github/workflows/cd.yaml'
  workflow_dispatch: # 수동 실행 허용

# OIDC로 AWS 로그인하기 위한 id-token 권한 설정
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  # ── 1. 백엔드 변경 감지 ──
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'back/**'

  # ── 2. 백엔드 이미지 빌드 → ECR push ──
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secrets 기반 application-secret.yaml 동적 생성 (Docker 이미지에 포함)
      - name: Create application-secret.yaml from Secret
        run: |
          mkdir -p back/src/main/resources
          echo "${{ secrets.APPLICATION_SECRET_YAML }}" > back/src/main/resources/application-secret.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/nbe10-12-3-team02:latest
            ${{ steps.ecr.outputs.registry }}/nbe10-12-3-team02:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. EC2 SSM 자동 배포 (send-command → wait → 결과 확인) ──
  deploy:
    needs: build-backend
    if: always() && needs.build-backend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # EC2가 SSM Parameter Store(/nbe10-12-3-team02/prod/env, SecureString)에서
      # 직접 .env를 받아오도록 함 - 비밀값이 GitHub Actions 워크플로/SSM 커맨드
      # 이력을 거치지 않고 EC2 인스턴스 role 권한으로만 조회됨
      - name: Sync .env to EC2 via SSM
        id: sync-env
        run: |
          COMMANDS=$(jq -n '[
            "set -e",
            "mkdir -p /home/ec2-user/app",
            "aws ssm get-parameter --name \"/nbe10-12-3-team02/prod/env\" --with-decryption --query \"Parameter.Value\" --output text > /home/ec2-user/app/.env",
            "chmod 600 /home/ec2-user/app/.env",
            "chown ec2-user:ec2-user /home/ec2-user/app/.env"
          ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Sync .env ${{ github.sha }}" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for .env sync to finish
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.sync-env.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Show .env sync output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.sync-env.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Send deploy command via SSM
        id: ssm
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMANDS=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg tag "$IMAGE_TAG" \
            '[
              "set -e",
              "cd /home/ec2-user/app",
              ("export ECR_REGISTRY=" + $registry),
              ("export IMAGE_TAG=" + $tag),
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              "docker compose --env-file .env pull",
              "docker compose --env-file .env up -d",
              "docker image prune -f"
            ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend ${{ github.sha }}" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy command to finish
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Show deploy command output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
